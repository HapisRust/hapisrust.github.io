name: server-status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Query server via gamedig
        env:
          # ip:port[:queryPort], comma-separated. port = game port
          GAME_SERVERS: "89.248.236.141:27442"
        run: |
          mkdir work && cd work
          npm init -y > /dev/null
          npm install gamedig@5.3.3 --no-audit --no-fund
          cat > write-status.mjs <<'SCRIPT'
          import { mkdir, writeFile } from "node:fs/promises";
          import { dirname } from "node:path";
          import { GameDig } from "gamedig";

          const servers = process.env.GAME_SERVERS.split(",")
            .map((s) => s.trim())
            .filter(Boolean)
            .map((s) => {
              const [ip, port, queryPort] = s.split(":");
              return { key: `${ip}:${port}`, ip, port: Number(port), queryPort: queryPort ? Number(queryPort) : null };
            });

          async function query(server) {
            const ports = server.queryPort ? [server.queryPort] : [server.port, server.port + 1];
            for (const port of ports) {
              try {
                const state = await GameDig.query({
                  type: "rust",
                  host: server.ip,
                  port,
                  maxRetries: 1,
                  attemptTimeout: 4000,
                  socketTimeout: 2000,
                });
                return { state: "online", players: state.numplayers, maxPlayers: state.maxplayers };
              } catch (e) {
                console.log(server.key, "port", port, "failed:", e.message);
              }
            }
            return { state: "offline" };
          }

          const entries = await Promise.all(servers.map(async (s) => [s.key, await query(s)]));
          const result = { ...Object.fromEntries(entries), updatedAt: Date.now() };
          console.log(JSON.stringify(result));

          const out = process.argv[2];
          await mkdir(dirname(out), { recursive: true });
          await writeFile(out, JSON.stringify(result));
          SCRIPT
          node write-status.mjs ../status-out/status.json

      - name: Publish to "status" branch
        working-directory: status-out
        run: |
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -qm "server status"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" status
